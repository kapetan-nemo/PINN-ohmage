seed: 42

ecm:
  hidden: 64
  layers: 3
  adam_epochs: 2000
  lr0: 1.0e-3
  lr_min: 1.0e-5
  lbfgs_iters: 100
  n_colloc: 512
  lambda_data: 1.0
  lambda_ode: 0.1
  lambda_soc: 1.0
  lambda_ic: 10.0
  eta_c: 1.0
  eps_soc: 1.0e-3

soh:
  mode: construction      # construction | penalty
  hidden_enc: 32
  latent: 16
  hidden_head: 16
  adam_epochs: 2000
  lr0: 2.0e-3
  lambda_kin: 1.0
  lambda_bc: 10.0
  lambda_mono: 40.0       # только для mode=penalty
  soh_end: 0.8
  n_cut_frac: 0.7         # обучение на первых 70% циклов, RUL-валидация на остальном

data:
  lir2025h_zip: data/raw/lir2025h/BatteryData.zip
  cr2032_parquet: data/raw/cr2032_sintef/discharging.parquet
  window: 21
  polyorder: 2

fast_ci:
  ecm_adam_epochs: 300
  soh_adam_epochs: 300
  max_points_per_segment: 600
